name: CI

# Baseline PR/push CI (docs/TASKS.md T05). No AWS or LLM secrets are read
# anywhere in this workflow (AGENTS.md rule 16) — every job runs fully
# offline / AI_MODE=mock. GITHUB_TOKEN is the only credential used, and only
# where GitHub requires it (the secret scan's API calls).

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default (AGENTS.md: least privilege). No job in this
# workflow needs to write anything, so none elevates this.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so gitleaks scans past commits too
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments need `pull-requests: write`, which this workflow
          # deliberately never grants (read-only by default) — the failed
          # check itself is what blocks merges, so the comment is skipped.
          GITLEAKS_ENABLE_COMMENTS: "false"

  deps:
    name: Dependency advisories (OSV)
    runs-on: ubuntu-latest
    # docs/SECURITY_AND_TESTING.md §8.5: "dependency advisory check with actionable report", and
    # §1 "Supply chain: dependency/lockfile updates, Dependabot or equivalent".
    # Dependabot (.github/dependabot.yml) opens the update PRs; this job is the gate that fails
    # one. OSV-Scanner reads all three of this repo's lockfiles (services/api/pom.xml,
    # services/agent/uv.lock, apps/web/pnpm-lock.yaml) in a single pass with no API key, registry
    # account or NVD throttling — which is why it replaced the obvious alternative of three
    # ecosystem-native audit commands with three output formats and three failure conventions.
    #
    # `security-events: write` would let the scanner upload SARIF into the Security tab's code
    # scanning alerts. This workflow stays read-only (see the top-level `permissions`), so the
    # report is the job log and the failed check itself. Turning on the Security tab's alerts is a
    # repository-settings change and therefore a human gate — see docs/MANUAL_SETUP.md.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan committed lockfiles
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          # Newline-separated, as the action's own `args` expects. Same scan `make audit-deps`
          # runs locally, pinned to the same scanner version (2.7.1).
          scan-args: |-
            --recursive
            ./

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: |
          shopt -s nullglob
          scripts=(scripts/*.sh)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts under scripts/ yet — nothing to check."
            exit 0
          fi
          shellcheck "${scripts[@]}"

  docs:
    name: Threat model references
    runs-on: ubuntu-latest
    # docs/TASKS.md T28: the threat model's "Test" column must keep naming tests that exist. A
    # renamed security test fails here rather than quietly turning a row into fiction.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check-threat-model.py

  api:
    name: Java (services/api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - name: Format check (Spotless)
        run: ./mvnw -B -q spotless:check
      # Full suite, including the Testcontainers-backed ApiApplicationTests —
      # GitHub-hosted ubuntu runners ship Docker, so this (correctly) runs
      # here even though it can't run in every local dev environment
      # (see docs/PROGRESS.md T02).
      - name: Build and test
        run: ./mvnw -B test
      # Re-run the security-tagged classes on their own (docs/TASKS.md T28). They already ran
      # above; what this adds is a named check whose red/green state is readable without opening
      # the log, and a build that fails if the tag selection ever matches nothing — a security
      # suite that silently stopped selecting anything is the failure mode worth guarding.
      - name: Security regression suite (must actually select tests)
        run: ./mvnw -B test -Dgroups=security

  agent:
    name: Python (services/agent)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    # T16's indexer and retrieval write and query real pgvector columns, so they need a real
    # database. The Java side gets one from Testcontainers; this job uses a service container,
    # which needs no Docker-in-test and starts once for the whole job.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opspilot_test
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot-ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # T25's consumer tests drive XREADGROUP, XAUTOCLAIM and the pending-entries list against a
      # real server. A fake would only prove the fake agrees with itself. Same image as
      # infra/docker-compose.yml and as the Java side's Testcontainers config.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DSN: postgresql://opspilot:opspilot-ci-local-only@localhost:5432/opspilot_test
      REDIS_TEST_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint (ruff)
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
        env:
          AI_MODE: mock # the default anyway — explicit here, matching AGENTS.md rule 16
      # Run the database-backed tests again on their own, so their result is visible rather than
      # buried in an aggregate pass. They skip wherever POSTGRES_TEST_DSN is absent (any machine
      # without Docker) — but the fixture turns that skip into a failure when CI is set, which
      # GitHub Actions always sets. A lost service container therefore fails the build instead of
      # passing while proving nothing.
      - name: Database-backed tests (must actually run)
        run: uv run pytest -m db --strict-markers
        env:
          AI_MODE: mock
      # Same reasoning for Redis (T25): the fixture fails rather than skips when CI is set, so a
      # lost service container fails the build instead of passing while proving nothing.
      - name: Redis-backed tests (must actually run)
        run: uv run pytest -m redis --strict-markers
        env:
          AI_MODE: mock
      # docs/TASKS.md T28, same reasoning as the Java job's security step: a named check, and a
      # failure if the marker ever selects nothing.
      - name: Security regression suite (must actually select tests)
        run: uv run pytest -m security --strict-markers
        env:
          AI_MODE: mock

  images:
    name: Container images
    runs-on: ubuntu-latest
    # docs/TASKS.md T32 acceptance: "local image builds and health checks". There is no Docker on
    # the development machine this project is written on (Gate H0), so CI is the only place that
    # claim can be made true at all — which is why this job builds every image on every PR rather
    # than only on the release path.
    #
    # It builds and *runs* them. A build-only job would have passed happily on an API image whose
    # ENTRYPOINT was `java -jar app.jar`, which is wrong for a layered Spring Boot extraction and
    # fails at runtime — exactly the error this job exists to catch.
    #
    # Nothing is pushed and no registry is contacted: no credentials, no AWS, no cost.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 here, not the arm64 the task definitions ask for. Building arm64 on an x86 runner
      # needs QEMU and is several times slower, and what this job verifies — that the Dockerfile
      # is correct and the image starts — is architecture-independent. The release workflow
      # builds the arm64 image that actually ships.
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/api
          load: true
          push: false
          tags: opspilot-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/agent
          load: true
          push: false
          tags: opspilot-worker:ci
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max

      # Root context: the web app imports the generated client through @contracts/*, which lives
      # outside apps/web, and Docker cannot copy from above its context.
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          push: false
          tags: opspilot-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Every image runs as a non-root user
        run: |
          for image in opspilot-api:ci opspilot-worker:ci opspilot-web:ci; do
            uid="$(docker run --rm --entrypoint id "$image" -u)"
            echo "$image runs as uid $uid"
            [ "$uid" != "0" ] || { echo "::error::$image runs as root"; exit 1; }
          done

      - name: The worker image can import what it is told to run
        # Proves the virtualenv, PYTHONPATH and module path are all right. T03's image had a CMD
        # that started the health API instead of the consumer; an image that cannot even import
        # the consumer would have looked fine until it was deployed.
        run: docker run --rm --entrypoint python opspilot-worker:ci -c "import opspilot_agent.streams; print('ok')"

      - name: The API image actually starts a JVM and reaches Spring
        # No database here, so the context will fail to finish starting — that is expected and is
        # not what this checks. What it checks is that the entrypoint is right and the classpath
        # is intact, by waiting for Spring's own startup line. A wrong ENTRYPOINT never gets here.
        run: |
          docker run -d --name api-smoke opspilot-api:ci
          for _ in $(seq 1 60); do
            if docker logs api-smoke 2>&1 | grep -q "Starting ApiApplication"; then
              echo "The API image started Spring."
              docker rm -f api-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::The API image never reached Spring startup. Logs:"
          docker logs api-smoke 2>&1 | tail -40
          docker rm -f api-smoke >/dev/null
          exit 1

      - name: The web image serves a page
        # /sign-in renders without Auth0 configured — it is the honest "not configured" state
        # (T08) — so this needs no secrets and still exercises the standalone server, the
        # HOSTNAME bind and the static assets.
        run: |
          docker run -d --name web-smoke -p 3000:3000 opspilot-web:ci
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/sign-in >/dev/null 2>&1; then
              echo "The web image served /sign-in."
              docker rm -f web-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::The web image never served a page. Logs:"
          docker logs web-smoke 2>&1 | tail -40
          docker rm -f web-smoke >/dev/null
          exit 1


  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # docs/TASKS.md T29. The smoke flows run on every PR, as §8 asks — they are the only thing in
    # this repository that proves web, API, worker, Postgres and Redis are actually joined up.
    #
    # Services rather than infra/docker-compose.test.yml: the compose file exists for local runs,
    # where it also has to avoid a developer's own servers. A GitHub runner has no developer
    # servers to avoid, and service containers start once for the whole job with health gating
    # built in, which is one less moving part in the place that can least afford one.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: opspilot_e2e
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot-ci-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/api/pom.xml
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            tests/e2e/pnpm-lock.yaml

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Install E2E dependencies
        working-directory: tests/e2e
        run: pnpm install --frozen-lockfile
      - name: Install worker dependencies
        working-directory: services/agent
        run: uv sync --locked

      # Cached by version, so a browser download (~100MB) happens once per Playwright bump rather
      # than on every run.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/e2e/pnpm-lock.yaml') }}
      - name: Install Playwright browser
        working-directory: tests/e2e
        run: pnpm exec playwright install --with-deps chromium

      - name: Create the environment file the stack script reads
        run: |
          cp .env.example .env
          {
            echo "POSTGRES_HOST=127.0.0.1"
            echo "POSTGRES_PORT=5432"
            echo "POSTGRES_USER=opspilot"
            echo "POSTGRES_PASSWORD=opspilot-ci-local-only"
            echo "REDIS_HOST=127.0.0.1"
            echo "REDIS_PORT=6379"
            echo "INTERNAL_SERVICE_SIGNING_SECRET=ci-only-internal-service-secret-$RANDOM$RANDOM"
          } >> .env

      - name: Run the E2E suite
        env:
          E2E_POSTGRES_DB: opspilot_e2e
          AI_MODE: mock
        run: make test-e2e

      # Only on failure, and only for 7 days. A Playwright trace records the rendered page, which
      # for a signed-in session includes the session cookie and the tenant's data — fictional here,
      # but the habit is the point (docs/SECURITY_AND_TESTING.md §8: "artifact uploads on failure
      # (sanitized)"). The stack logs go up too, because a failure is usually the API or the worker
      # rather than the browser, and without them the trace shows a sad page and no reason.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-artifacts
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  web:
    name: Next.js (apps/web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: corepack enable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # T11 drift check (the TS-client half; services/api's OpenApiSpecDriftTest
      # job checks the spec-vs-backend half): packages/contracts/src/schema.d.ts
      # must be exactly what openapi-typescript produces from the committed
      # openapi.json right now.
      - name: Verify generated TS client has no drift
        working-directory: packages/contracts
        run: bash scripts/check-schema-drift.sh
