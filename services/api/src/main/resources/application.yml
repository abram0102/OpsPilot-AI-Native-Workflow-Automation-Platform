spring:
  application:
    name: api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
  datasource:
    hikari:
      # 2 seconds, not Hikari's 30-second default. Found by T33's database-outage drill: with
      # the database unreachable the readiness probe did eventually answer DOWN — after 30.016
      # seconds, which Spring itself logged as "Health contributor DataSourceHealthIndicator (db)
      # took 30016ms to respond".
      #
      # Why that is a production problem and not a slow log line. T31's ALB target group health
      # check has a 5-second timeout, so every probe would time out rather than receive a clean
      # DOWN — the task is removed from rotation for the right reason by accident. Worse, each
      # hanging probe holds a Tomcat worker thread for the full 30 seconds; with the ALB and
      # ECS both probing, those accumulate, and a thread pool starved during a database outage
      # takes liveness down with it. "Remove from rotation" becomes "kill and restart", in a
      # loop, at exactly the moment the system is already degraded.
      #
      # The trade is real and deliberate: this timeout also bounds how long a *request* waits
      # for a connection when the pool is busy, so under sustained load requests now fail after
      # two seconds instead of queueing for thirty. That is the better failure — fail fast and
      # let the load balancer shed — but it is a behaviour change, not a free win.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}

server:
  port: ${API_PORT:8080}

# Deliberately NOT spring.security.oauth2.resourceserver.jwt.* — that would
# let Spring Boot auto-configure its own JwtDecoder bean, which resolves the
# issuer eagerly at startup and would break every environment without a real
# Auth0 tenant configured (all of local dev and CI before T08). See
# JwtDecoderConfig for the hand-built, lazy decoder this project uses instead.
app:
  security:
    oidc-issuer-uri: ${API_OIDC_ISSUER_URI:https://REPLACE-ME.auth0.com/}
    oidc-audience: ${API_OIDC_AUDIENCE:https://api.opspilot.local}
    # Default false (safe); local profile turns it on. ProductionSafetyGuard
    # refuses to start if this is ever true under the "production" profile.
    allow-test-issuer: ${API_ALLOW_TEST_ISSUER:false}
    test-issuer:
      # T29: lets an out-of-process harness (Playwright) mint tokens this API accepts, as base64
      # PKCS#8. The E2E harness generates it per run and passes it in; it is never committed.
      # Read only inside a bean that does not exist unless allow-test-issuer is on, so setting it
      # on a production deployment achieves nothing.
      private-key: ${API_TEST_ISSUER_PRIVATE_KEY:}
    # T21: the machine-only internal action API. A distinct audience and a distinct signing key,
    # so a user's browser token cannot reach /internal/** even by accident — the two filter
    # chains validate against different decoders entirely (docs/DECISIONS.md ADR-045).
    internal-service:
      audience: ${INTERNAL_SERVICE_AUDIENCE:https://internal.opspilot.local}
      signing-secret: ${INTERNAL_SERVICE_SIGNING_SECRET:}
  outbox:
    stream-key: ${REDIS_STREAM_NAME:opspilot:events}
    consumer-group: ${REDIS_CONSUMER_GROUP:agent-workers}
    batch-size: ${OUTBOX_BATCH_SIZE:100}
    max-attempts: ${OUTBOX_MAX_ATTEMPTS:8}
    backoff-base: ${OUTBOX_BACKOFF_BASE:PT1S}
    publisher:
      # Off by default, including under the `local` profile — the test suite runs under that
      # profile (application.yml makes it the default and no test overrides it), so enabling it
      # there would start a 2-second timer inside every @SpringBootTest, claiming and publishing
      # rows that other tests assert on. `.env` sets OUTBOX_PUBLISHER_ENABLED=true and `make
      # api-dev` loads it, which is how a real local run gets the publisher.
      enabled: ${OUTBOX_PUBLISHER_ENABLED:false}
      interval-ms: ${OUTBOX_PUBLISHER_INTERVAL_MS:2000}
  invitations:
    # ISO-8601 duration. No invitation email is sent in V1 (docs/TASKS.md T09); the token is
    # shown once, to the owner/admin who created it, via a protected response.
    ttl: ${API_INVITATION_TTL:P7D}

# The real OpenAPI contract (T11) must document only production endpoints. springdoc scans the
# whole Spring context, so during a Testcontainers-backed test run it would otherwise also
# document the test-only fixture controllers under /__test/** (TestEchoController and friends,
# component-scanned because they live under com.opspilot.* on the test classpath) — confirmed as
# a real bug via the bootstrap run, not a hypothetical (docs/DECISIONS.md ADR-033).
# /internal/** is excluded for the same reason as /__test/**, not for convenience: this spec
# generates the *browser* TS client, and the internal action API is one no browser may ever call
# (docs/API_CONTRACT.md: "reject normal browser/user tokens"). Publishing it into the frontend's
# type surface would advertise the exact mistake the audience split exists to prevent. A test
# asserts the exclusion holds rather than trusting this line (docs/DECISIONS.md ADR-045).
springdoc:
  paths-to-exclude: /__test/**,/internal/**

# T13: local filesystem adapter by default; S3 only when storage.provider=s3 (Gate H3 — a real
# AWS bucket/credentials, not needed for this provider's default). .env.example documents these
# as STORAGE_PROVIDER/STORAGE_LOCAL_DIR/AWS_S3_BUCKET/AWS_REGION.
# T24: the outbox publisher. Publication is a separate transaction from the business write,
# so Redis being unavailable delays delivery and never fails a request — the backlog accrues in
# `outbox_events` and drains on recovery. Deliberately disabled by default: tests drive
# publishBatch() directly rather than waiting on a timer, and the local profile turns it on.
storage:
  provider: ${STORAGE_PROVIDER:local}
  local-dir: ${STORAGE_LOCAL_DIR:.local-storage}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:}

management:
  endpoints:
    web:
      exposure:
        # health and prometheus only. Never widen this to "*" or add other operational endpoints
        # without a documented need (AGENTS.md).
        #
        # "Exposed" here means the endpoint exists at /actuator/**. It does NOT mean public:
        # SecurityConfig permits only /actuator/health/**, so a scrape of /actuator/prometheus
        # still needs a bearer token or a network path that never reaches the internet. That is
        # deliberate — metrics name internal structure (endpoint templates, queue names, error
        # codes) and a run-status distribution is a business figure (T30; docs/OBSERVABILITY.md
        # explains how to scrape it).
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # T24: deliberately readinessState + db only. Redis is NOT in here. An unreachable Redis
        # delays event delivery; it does not stop the API from serving requests, and the outbox
        # keeps the backlog durable until Redis returns. Removing a healthy API from rotation
        # because a queue is down would turn a delivery delay into an outage. Redis still appears
        # in the full /actuator/health document, so the outage stays visible to operators.
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
