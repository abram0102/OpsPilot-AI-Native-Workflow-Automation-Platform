spring:
  application:
    name: api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Only health is exposed publicly. Never widen this to "*" or add
        # other operational endpoints without a documented need (AGENTS.md).
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

logging:
  pattern:
    level: "%5p [requestId=%X{requestId}]"
