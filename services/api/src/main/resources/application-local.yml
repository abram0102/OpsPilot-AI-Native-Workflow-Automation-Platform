# Local development profile (active by default — see application.yml).
# Values come from the repository root `.env` (see `.env.example`), which
# `make api-dev` (T05+) loads before starting this service. No secrets are
# hardcoded here; POSTGRES_PASSWORD has no default and fails fast if unset.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:opspilot}
    username: ${POSTGRES_USER:opspilot}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns all schema (docs/DATA_MODEL.md, AGENTS.md rule 4). Never
      # "update" here, even in local dev.
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # T24: the outbox publisher runs in local development, because `make infra-up` provides the
  # Redis it needs. It stays off in `application.yml`'s defaults so the test suite drives
  # publishBatch() directly instead of racing a timer.
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
  security:
    # Safe to default true here: it only enables trusting a key pair this
    # same process generates for itself (TestIssuerConfig) and nothing
    # resembling it can reach a real deployment (ProductionSafetyGuard).
    allow-test-issuer: ${API_ALLOW_TEST_ISSUER:true}
    # T21: a known local-only secret, so local development and the test suite can mint service
    # tokens without any setup. ProductionSafetyGuard refuses to start if this value is ever
    # seen under the 'production' profile — it is published in this repository, so anyone could
    # mint a worker token with it.
    internal-service:
      signing-secret: >-
        ${INTERNAL_SERVICE_SIGNING_SECRET:local-development-only-internal-service-secret-not-for-production}

logging:
  level:
    com.opspilot: DEBUG
