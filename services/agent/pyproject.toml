[project]
name = "opspilot-agent"
version = "0.1.0"
description = "OpsPilot Python AI worker: LangGraph orchestration, tenant-scoped RAG, tool execution."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    # Runtime (not just test) since T15: the real provider adapter speaks HTTP directly rather
    # than through a vendor SDK. See docs/DEPENDENCY_DECISIONS.md.
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot_agent"]
