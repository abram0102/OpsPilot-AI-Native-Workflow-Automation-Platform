[project]
name = "opspilot-agent"
version = "0.1.0"
description = "OpsPilot Python AI worker: LangGraph orchestration, tenant-scoped RAG, tool execution."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "langgraph>=0.2",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    # Runtime (not just test) since T15: the real provider adapter speaks HTTP directly rather
    # than through a vendor SDK. See docs/DEPENDENCY_DECISIONS.md.
    "httpx>=0.27",
    "pypdf>=7.0.0",
    "langgraph-checkpoint-postgres>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    # Needs PostgreSQL + pgvector via POSTGRES_TEST_DSN. Skipped where there is no database
    # (Gate H0); CI runs these as their own step against a service container, so they cannot
    # silently skip there.
    "db: requires a real PostgreSQL database",
    # Needs a real Redis via REDIS_TEST_URL. Same rule as `db`: skipped where there is no Redis,
    # and the fixture fails rather than skips in CI, where the service container should have
    # provided one.
    "redis: requires a real Redis server",
    # The security/tenant-isolation regression suite (docs/TASKS.md T28), run on its own by
    # `make test-security`. Applied per module rather than per test: these modules are about a
    # security property start to finish, and a marker that has to be remembered on each new test
    # is a marker that will be forgotten.
    "security: part of the security regression suite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opspilot_agent"]
